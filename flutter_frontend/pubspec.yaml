name: leaf_compass_app
description: "LeafCompass – Smart Farming AI Companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # HTTP / Networking
  dio: ^5.7.0

  # Image Picker (Disease Detection)
  image_picker: ^1.1.2

  # Local Storage (Auth token, preferences)
  shared_preferences: ^2.3.2

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.1

  # Fonts
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.0

  # URL launcher (footer links)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
